[project]
name = "agentfix"
version = "0.1.0"
description = "A teaching coding agent: tools, a loop, and verification"
requires-python = ">=3.12"
dependencies = ["openai>=1.40", "pytest>=8.3"]

[project.optional-dependencies]
eval = ["datasets>=2.20.0"]
dev = ["ruff>=0.6", "black>=24.8", "pytest-cov>=5.0", "mypy>=1.11"]

[project.scripts]
agentfix = "agentfix.cli:cli_entry"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentfix"]

[tool.pytest.ini_options]
testpaths = ["exercises"]
markers = ["llm: requires a running Ollama with the Mellum2 model (deselect with '-m \"not llm\"')"]
addopts = "-m 'not llm'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
files = ["src/agentfix"]
python_version = "3.12"
strict = true

# `datasets` ships no py.typed marker. It is an optional [eval] extra behind a local import,
# so treat it as untyped rather than vendoring stubs for one call site.
[[tool.mypy.overrides]]
module = "datasets.*"
ignore_missing_imports = true

[tool.black]
line-length = 100
target-version = ["py312"]
